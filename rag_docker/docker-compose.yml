version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - /opt/rag_service/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-milvus-minio}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:-change-this-password}
    # ⚠️ 端口已移除：服务器上 RAGFlow 的 MinIO 已占用 9000/9001
    # 此 MinIO 仅供 Milvus 内部使用，无需对外暴露
    volumes:
      - /opt/rag_service/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.3.1
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-milvus-minio}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-change-this-password}
    volumes:
      - /opt/rag_service/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  rag-service:
    image: rag_service-rag-service-tender:phase3c
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api-service
    ports:
      - "8001:8001"
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HOME=/model_cache
      - HF_HUB_CACHE=/model_cache/hub
      - TRANSFORMERS_CACHE=/model_cache/transformers
      - SENTENCE_TRANSFORMERS_HOME=/model_cache
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - RAG_MODEL_OFFLINE=true
      - EMBEDDING_MODEL_NAME=maidalun1020/bce-embedding-base_v1
      - EMBEDDING_MODEL_PATH=/model_cache/hub/models--maidalun1020--bce-embedding-base_v1/snapshots/9c0d82af44af61abe171ffae23fde5740c0ec1a8
      - RAG_MAX_SUB_QUERIES=6
      - RAG_MAX_QUERY_CHARS=80
      - MILVUS_LOAD_TIMEOUT_SECONDS=90
      - MILVUS_SEARCH_TIMEOUT_SECONDS=20
      - RAG_BM25_FALLBACK_ON_MILVUS_ERROR=true
      - RAG_VECTOR_ENABLED=true
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - RELOAD_SECRET=${RELOAD_SECRET:-change-me-rag-reload-secret}
      - TENDER_EVIDENCE_INDEX_SECRET=${TENDER_EVIDENCE_INDEX_SECRET:-}
      - TENDER_EVIDENCE_INDEX_SECRET_FILE=/run/secrets/tender_evidence_index.secret
      - TENDER_EVIDENCE_COLLECTION=tender_evidence_blocks_v1
      - TENDER_EVIDENCE_VECTOR_DIMENSION=768
      - TENDER_EVIDENCE_MAX_BLOCKS=10000
      - TENDER_EVIDENCE_EMBED_CHUNK_SIZE=128
    volumes:
      - /opt/rag_service/model_cache:/model_cache
      - /opt/rag_service/hybrid_searcher.py:/app/hybrid_searcher.py:ro
      - /opt/rag_service/rag_materials.json:/app/rag_materials.json:ro
      - /opt/rag_service/tender_evidence_index.secret:/run/secrets/tender_evidence_index.secret:ro
    depends_on:
      - standalone
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    container_name: quote-redis
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - /opt/rag_service/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  quote-minio:
    container_name: quote-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${QUOTE_MINIO_ROOT_USER:-quoteadmin}
      MINIO_ROOT_PASSWORD: ${QUOTE_MINIO_ROOT_PASSWORD:-change-this-password}
      MINIO_ACCESS_KEY: ${QUOTE_MINIO_ROOT_USER:-quoteadmin}
      MINIO_SECRET_KEY: ${QUOTE_MINIO_ROOT_PASSWORD:-change-this-password}
    command: minio server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - /opt/rag_service/volumes/quote-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rag_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  rag_net:
    driver: bridge
