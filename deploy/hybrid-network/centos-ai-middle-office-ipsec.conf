# AI Middle Office temporary hybrid tunnel: local CentOS initiator.
# The shared secret is stored separately in /etc/ipsec.d/ai-middle-office.secrets.
conn ai-middle-office-hybrid
    type=tunnel
    authby=secret
    ikev2=insist
    ike=aes_gcm256-sha2_256;modp2048
    esp=aes_gcm256
    pfs=yes
    fragmentation=yes
    rekey=yes
    ikelifetime=8h
    salifetime=1h
    # Both peers use passive IKEv2 liveness for compatibility with the
    # temporary CGNAT path; NAT-T keepalives remain enabled by Libreswan.
    dpddelay=0
    left=%defaultroute
    leftid=@local-centos-rag
    leftsubnet=192.168.88.128/32
    right=8.163.58.211
    rightid=@ecs-ai-middle-office
    rightsubnet=10.240.10.0/24
    auto=start
