x-dify-runtime: &dify-runtime
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  init_permissions:
    <<: *dify-runtime
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64

  api:
    <<: *dify-runtime
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 384

  worker:
    <<: *dify-runtime
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 384

  worker_beat:
    <<: *dify-runtime
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 192

  plugin_daemon:
    <<: *dify-runtime
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 384

  ssrf_proxy:
    <<: *dify-runtime
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  web:
    <<: *dify-runtime
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  redis:
    <<: *dify-runtime
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128

  sandbox:
    <<: *dify-runtime
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256

  db_postgres:
    <<: *dify-runtime
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 256

  weaviate:
    <<: *dify-runtime
    mem_limit: 1g
    cpus: 0.75
    pids_limit: 256

  nginx:
    <<: *dify-runtime
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    networks:
      default: {}
      app_net:
        aliases:
          - dify-nginx

networks:
  app_net:
    external: true
    name: ai-middle-office-app-net
