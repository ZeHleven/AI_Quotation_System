# Phase 6 HTTPS-only reverse proxy for the AI Middle Office.
#
# This file is intentionally not an HTTP/80 challenge configuration. The free
# certificate must be issued with a DNS-01 challenge so the public entry stays
# HTTPS-only. Do not enable this file until the certificate paths below exist.

limit_req_zone $binary_remote_addr zone=ai_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ai_login:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ai_per_ip:10m;

map $http_upgrade $ai_connection_upgrade {
    default upgrade;
    ''      close;
}

# A single URI policy avoids response-phase Content-Type timing differences.
# Every non-hashed response is no-store; only hashed Vite assets are immutable.
map $uri $ai_cache_control {
    default "no-store";
    "~^/assets/[^/?]+-[A-Za-z0-9_-]{8,}\.(?:css|js|json|svg|png|jpe?g|gif|webp|avif|ico|woff2?)$"
        "public, max-age=31536000, immutable";
}

# The deployed Nginx has the built-in gzip module and gzip_static support but
# no Brotli module. Compress only text-based responses and keep SSE excluded.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;

upstream ai_middle_office_api {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Reject HTTPS requests for unexpected Host/SNI values. The certificate is
# shared only so Nginx can complete TLS before returning the rejection.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/www.qskingship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qskingship.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.qskingship.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/www.qskingship.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.qskingship.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AI_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 300m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 300s;

    limit_conn ai_per_ip 20;
    limit_conn_status 429;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Cache policy remains at server scope so child locations continue
    # inheriting every security header above. Ignore conflicting upstream cache
    # metadata because the edge policy is intentionally authoritative.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control $ai_cache_control always;

    # PUBLIC_ACCESS_ENABLED remains false during the controlled trial. In that
    # mode FastAPI intentionally keeps docs and internal POC routes mounted, so
    # the public reverse proxy must fail closed for them.
    location = /docs { return 404; }
    location ^~ /docs/ { return 404; }
    location = /redoc { return 404; }
    location ^~ /redoc/ { return 404; }
    location = /openapi.json { return 404; }
    location ^~ /api/v1/admin/codex-worker/ { return 404; }
    location ^~ /api/v1/admin/dwg-quantity-trial/ { return 404; }

    # Detailed dependency readiness is for localhost operations only.
    location = /health/ready {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://ai_middle_office_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/v1/auth/login {
        limit_req zone=ai_login burst=4 nodelay;

        proxy_pass http://ai_middle_office_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=ai_general burst=40 nodelay;

        proxy_pass http://ai_middle_office_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_connection_upgrade;

        # Quote job and chat endpoints use server-sent events.
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
