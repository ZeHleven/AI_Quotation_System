# AI Middle Office temporary hybrid tunnel: ECS responder.
# The shared secret is stored separately in /etc/ipsec.d/ai-middle-office.secrets.
conn ai-middle-office-hybrid
    type=tunnel
    authby=secret
    keyexchange=ikev2
    ike=aes_gcm256-sha2_256;modp2048
    esp=aes_gcm256
    pfs=yes
    fragmentation=yes
    rekey=yes
    ikelifetime=8h
    salifetime=1h
    # Passive IKEv2 liveness avoids active-probe interoperability failures
    # across the temporary CGNAT path; NAT-T keepalives remain enabled.
    dpddelay=0
    left=%defaultroute
    leftid=@ecs-ai-middle-office
    leftsubnet=10.240.10.0/24
    right=%any
    rightid=@local-centos-rag
    rightsubnet=192.168.88.128/32
    auto=add
