name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    paths:
      - "AI_Middle_Office/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AI_Middle_Office
    env:
      DATABASE_URL: sqlite:///./ci_sql_app.db
      JWT_SECRET_KEY: ci-jwt-secret
      WEBHOOK_SECRET: ci-webhook-secret
      RELOAD_SECRET: ci-reload-secret
      ZHIPU_API_KEY: ci-zhipu-key
      RAG_SERVICE_URL: http://127.0.0.1:8001
      N8N_WEBHOOK_URL_CALC: http://127.0.0.1:5678/webhook/budget-calc
      N8N_WEBHOOK_URL_PUSH: http://127.0.0.1:5678/webhook/budget-push
      MATERIALS_FILE: ./ci_rag_materials.json
      PUBLIC_ACCESS_ENABLED: "false"
      FEATURE_COST_DB: "true"
      FEATURE_NO_COST_DRAFT_CAPTURE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AI_Middle_Office/requirements.txt
            AI_Middle_Office/requirements-dev.txt
            AI_Middle_Office/requirements-agent.in
            AI_Middle_Office/requirements-agent-dev.in

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-agent-dev.in

      - name: Compile backend
        run: python -m compileall app tests

      - name: Run tests
        run: pytest -q
